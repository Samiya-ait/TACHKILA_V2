<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css" />
    <title>effectif</title>
  </head>
  <body class="bg-slate-500">
    <header>
      <nav
        class="flex justify-between bg-slate-800 pr-2 pl-2 pb-3 pt-3 border-b text-sm"
      >
        <div class="flex gap-1">
          <img
            class="bg-white rounded-full max-sm:w-5 max-sm:h-5"
            width="20"
            height="20"
            src="https://img.icons8.com/sf-ultralight/25/football2.png"
            alt="football2"
          />
          <p class="text-white font-bold">TACHKILA</p>
        </div>
        <div class="">
          <ul
            class="flex gap-3 rounded-lg pr-2 pl-2 border border-#334155 text-white"
          >
            <li><a href="index.html">Effectif</a></li>
            <li><a href="composition.html">Composition</a></li>
            <li><a href="matchs.html">Matchs</a></li>
          </ul>
        </div>
        <div>
          <ul class="flex gap-5">
            <li class="text-orange-500">GB</li>
            <li class="text-blue-600">DEF</li>
            <li class="text-green-600">MIL</li>
            <li class="text-red-600">ATT</li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="bg-slate-900 flex flex-col gap-10 p-10">
      <div
        id="msg-success"
        hidden
        class="fixed inset-0 z-20 flex items-center justify-center p-4 pointer-events-none"
      >
        <p
          class="rounded-lg border border-white bg-green-500 px-4 py-2 text-white"
        >
          Player added successfully
        </p>
      </div>
      <!-- modifier player  -->
      <div
        class="scall absolute w-full z-50 h-full flex justify-center items-center"
        hidden
        id="modifier"
      >
        <div class="flex justify-center items-center">
          <div class="w-full border p-5 rounded-xl bg-slate-900 text-gray-400">
            <div class="flex justify-between items-center">
              <h2>
                <strong>Modifier un joueur</strong>
              </h2>

              <button
                type="button"
                class="flex justify-center modifier-close-btn"
              >
                <strong>&times;</strong>
              </button>
            </div>

            <div class="flex flex-col">
              <label class="cursor-pointer opacity-40" for="edit-player">
                Nom complet
              </label>

              <input
                class="w-100 h-7 border rounded-md"
                type="text"
                required
                id="edit-player"
              />
            </div>

            <p class="edit-error-msg-name text-red-400"></p>

            <div class="flex items-center gap-2">
              <h3 class="opacity-40">Poste</h3>
              <p class="edit-msg-post"></p>
            </div>

            <div class="flex flex-col gap-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    class="bg-[#111a2d] border rounded-xl py-1 w-40 cursor-pointer edit-btn-post"
                  >
                    <p>Gardien</p>
                  </button>
                </div>

                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    class="bg-[#111a2d] border rounded-xl py-1 w-40 cursor-pointer edit-btn-post"
                  >
                    <p>Milieu</p>
                  </button>
                </div>
              </div>

              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    class="bg-[#111a2d] border rounded-xl py-1 w-40 cursor-pointer edit-btn-post"
                  >
                    <p>Défenseur</p>
                  </button>
                </div>

                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    class="bg-[#111a2d] border rounded-xl py-1 w-40 cursor-pointer edit-btn-post"
                  >
                    <p>Attaquant</p>
                  </button>
                </div>
              </div>
            </div>

            <h3 class="opacity-40">état</h3>
            <div class="flex items-center justify-between">
              <!-- En Forme -->

              <button
                type="button"
                class="w-30 bg-green-700 border rounded-xl py-1 cursor-pointer bt_sitiation"
              >
                En Forme
              </button>

              <!-- Blessé -->

              <button
                type="button"
                class="w-30 bg-[#111a2d] border rounded-xl py-1 cursor-pointer bt_sitiation"
                id="btn_bless"
              >
                Blessé
              </button>
            </div>

            <div class="flex justify-center">
              <div class="flex flex-col">
                <label
                  class="cursor-pointer opacity-40"
                  for="edit-numberofplayer"
                >
                  Numéro (1 à 99)
                </label>

                <input
                  class="border w-100 h-7 rounded-md"
                  type="number"
                  required
                  placeholder="Ex. 7"
                  id="edit-numberofplayer"
                />

                <p class="edit-msg-number text-red-400"></p>
              </div>
            </div>
            <div class="flex flex-col">
              <label for="age" class="opacity-40">age (15 à 55)</label
              ><input
                type="number"
                placeholder="age..."
                required
                id="age_modif"
                class="border w-100 h-7 rounded-md"
              />
              <p class="msg-age text-red-400"></p>
            </div>

            <div class="flex justify-end gap-4">
              <button
                type="button"
                class="bg-[#111a2d] border rounded-xl py-1.5 px-4 cursor-pointer modifier-close-btn"
              >
                <strong>Annuler</strong>
              </button>

              <button
                type="button"
                class="bg-blue-900 border rounded-xl py-1.5 px-4 cursor-pointer"
                id="btn-edit-submit"
              >
                <strong>Enregistrer</strong>
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- delete player  -->
      <div
        id="modal-delete"
        hidden
        class="absolute inset-0 z-50 flex items-center justify-center "
      >
        <div
          class="w-full max-w-md rounded-xl border border-slate-700 bg-slate-950 p-6 text-white"
        >
          <h2 class="mb-4 text-lg font-bold">Supprimer un joueur</h2>

          <p id="delete-message" class="mb-6 text-slate-300"></p>

          <div class="flex justify-end gap-3">
            <button
              id="cancel-delete"
              type="button"
              class="rounded-lg border border-slate-600 px-4 py-2"
            >
              Annuler
            </button>

            <button
              id="confirm-delete"
              type="button"
              class="rounded-lg bg-red-500 px-4 py-2"
            >
              Supprimer
            </button>
          </div>
        </div>
      </div>
      <!-- add player -->
      <div
        class="scall absolute w-full z-50 h-full flex justify-center items-center"
        hidden
        id="ajout"
      >
        <div class="flex justify-center items-center">
          <div class="w-full border p-5 rounded-xl bg-slate-900 text-gray-400">
            <div class="flex justify-between items-center">
              <h2><strong>ajouter un joueur</strong></h2>
              <button class="flex justify-center ajout-btn">
                <strong>&times;</strong>
              </button>
            </div>

            <div class="flex flex-col">
              <label class="cursor-pointer opacity-40" for="player"
                >nom complet</label
              >
              <input
                class="w-100 h-7 border rounded-md"
                type="text"
                required
                placeholder="nom.."
                id="player"
              />
            </div>
            <p class="error-msg-name text-red-400"></p>

            <div class="flex items-center gap-2">
              <h3 class="opacity-40">poste</h3>
              <p class="msg-post"></p>
            </div>
            <div class="flex flex-col gap-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <button
                    class="bg-[#111a2d] border rounded-xl py-1 w-40 cursor-pointer btn-post"
                  >
                    Gardien
                  </button>
                </div>
                <div class="flex items-center gap-2">
                  <button
                    class="bg-[#111a2d] border rounded-xl py-1 w-40 cursor-pointer btn-post"
                  >
                    Milieu
                  </button>
                </div>
              </div>
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <button
                    class="bg-[#111a2d] border rounded-xl py-1 w-40 cursor-pointer btn-post"
                  >
                    Défenseur
                  </button>
                </div>
                <div class="flex items-center gap-2">
                  <button
                    class="bg-[#111a2d] border rounded-xl py-1 w-40 cursor-pointer btn-post"
                  >
                    Attaquant
                  </button>
                </div>
              </div>
            </div>
            <p class="msg-sitiation hidden text-red-500">
              Veuillez choisir une situation.
            </p>
            <h3 class="opacity-40">état</h3>
            <div class="flex items-center justify-between">
              <!-- En Forme -->
              <button
                type="button"
                class="w-30 border rounded-xl py-1 cursor-pointer btn_sitiation"
              >
                En Forme
              </button>

              <button
                type="button"
                class="w-30 bg-[#111a2d] border rounded-xl py-1 cursor-pointer btn_sitiation"
              >
                Blessé
              </button>
            </div>
            <div class="flex justify-center">
              <div class="flex flex-col">
                <label class="cursor-pointer opacity-40" for="numberofplayer"
                  >Numéro (1 á 99)</label
                >
                <input
                  class="border w-100 h-7 rounded-md"
                  type="number"
                  required
                  placeholder="Ex. 7"
                  id="numberofplayer"
                />
                <p class="msg-number text-red-400"></p>
              </div>
            </div>
            <div  class="flex flex-col">
              <label for="age" class="opacity-40">age (15 à 55)</label
              ><input
                type="number"
                placeholder="age..."
                required
                id="age"
                class=" border w-100 h-7 rounded-md text-white"
              />
              <p class="edit-msg-age text-red-400"></p>
            </div>

            <div class="flex justify-end gap-4 classs">
              <button
                class="bg-[#111a2d] border rounded-xl py-1.5 px-4 cursor-pointer ajout-btn"
              >
                <strong>Annuler</strong>
              </button>
              <button
                class="bg-green-500 border rounded-xl py-1.5 px-4 cursor-pointer"
                id="btn-submit"
              >
                <strong>Ajouter</strong>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- hero section -->
      <div class="flex justify-between">
        <h1 class="text-4xl font-bold text-white">Effectif</h1>
        <button
          class="ajout-btn w-full sm:w-60 h-10 bg-green-500 text-white rounded-md font-bold cursor-pointer text-base"
        >
          + Ajouter un joueur
        </button>
      </div>
      <!-- search bar and filter -->
      <div
        class="flex justify-between items-center border bg-slate-900 text-white rounded-lg"
      >
        <div class="w-full">
          <input
            class="px-4 py-1 w-full text-white rounded bg-slate-800"
            type="search"
            id="search"
            placeholder="Rechercher un joueur par nom..."
          />
        </div>

        <div>
          <ul class="flex gap-6 text-x p-1">
            <li class="rounded w-15 px-3 pb-1 choice_s">tous</li>
            <li class="rounded w-15 px-3 pb-1 choice_s">GB</li>
            <li class="rounded w-15 px-3 pb-1 choice_s">DEF</li>
            <li class="rounded w-15 px-3 pb-1 choice_s">MIL</li>
            <li class="rounded w-15 px-3 pb-1 choice_s">ATT</li>
          </ul>
        </div>
      </div>
      <!-- end of hero -->
      <section id="rand" class="grid grid-cols-4 w-full gap-6"></section>
    </main>
    <div hidden>
      <div class="form_general_player">
        <div class="player-card"></div>
        <div class="select-group">
          <select></select>
        </div>
      </div>
    </div>
  </body>
  <script type="module" src="js/effectif.js"></script>
</html>
